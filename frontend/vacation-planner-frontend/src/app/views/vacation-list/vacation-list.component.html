<div class="container mt-5">
  <h2 class="mb-4">Your Vacations</h2>
  <button class="btn btn-outline-success" [routerLink]="['/vacations/new']">Add New Vacation</button>
  <button class="btn btn-outline-primary" (click)="goToReports()">Vacation Report</button>
  <button class="btn btn-outline-danger" (click)="logout()">Logout</button>


  <div *ngIf="vacations.length === 0" class="alert alert-info">
    You haven't added any vacations yet.
  </div>

  <div class="mb-3">
    <input
      type="text"
      class="form-control"
      placeholder="Search vacations..."
      [(ngModel)]="searchTerm"
    />
  </div>

  <table class="table table-striped table-hover">
    <thead>
      <tr>
        <th>Title</th>
        <th>Excursions</th>
        <th>Start</th>
        <th>End</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let vacation of filteredVacations">
        <td>{{ vacation.title }}</td>
        <td>{{ vacation.excursionCount }}</td>
        <td>{{ vacation.startDate | date }}</td>
        <td>{{ vacation.endDate | date }}</td>
        <td>
          <button class="btn btn-outline-primary btn-sm" [routerLink]="['/vacations', vacation.id]">View/Update</button>
          <button 
            class="btn btn-outline-danger btn-sm"
            (click)="deleteVacation(vacation)"
            data-bs-toggle="tooltip" 
            title="Delete Vacation"
          >Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Toast Container -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
  <div id="excursionToast" class="toast align-items-center bg-warning-subtle" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body">
        Vacations with excursions cannot be deleted. Please delete excursions first.
      </div>
      <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>
</div>
