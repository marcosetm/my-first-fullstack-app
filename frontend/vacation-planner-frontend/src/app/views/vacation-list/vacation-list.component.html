<div class="container mt-5">
  <h2 class="mb-4">Your Vacations</h2>
  <button class="btn btn-outline-success" >Add New Vacation</button>
  <button class="btn btn-outline-danger" (click)="logout()">Logout</button>

  <div *ngIf="vacations.length === 0" class="alert alert-info">
    You haven't added any vacations yet.
  </div>

  <div class="row row-cols-1 row-cols-md-2 g-4">
    <div class="col" *ngFor="let vacation of vacations">
      <div class="card h-100 shadow-sm">
        <div class="card-body">
          <h5 class="card-title">{{ vacation.title }}</h5>
          <p class="card-text">
            From: {{ vacation.startDate }}<br />
            To: {{ vacation.endDate }}
          </p>
          <a href="#" class="btn btn-outline-primary btn-sm">View/Update</a>
          <a href="#" class="btn btn-outline-danger btn-sm">Delete</a>
        </div>
      </div>
    </div>
  </div>
</div>
