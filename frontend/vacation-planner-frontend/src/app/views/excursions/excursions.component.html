<h5 class="d-flex justify-content-between align-items-center">
  Excursions
  <button class="btn btn-sm btn-outline-primary" (click)="toggleForm()">
    {{ showForm ? 'Cancel' : 'Add Excursion' }}
  </button>
</h5>

<!-- Show form only when showForm is true -->
<form *ngIf="showForm" [formGroup]="excursionForm" (ngSubmit)="onSubmit()" class="mb-3">
  <div class="mb-2">
    <label for="name" class="form-label">Excursion Name</label>
    <input type="text" id="name" class="form-control" formControlName="name" />
  </div>
  <div class="mb-2">
    <label for="date" class="form-label">Excursion Date</label>
    <input type="date" id="date" class="form-control" formControlName="date" />
    <div class="text-danger" *ngIf="excursionForm.get('date')?.hasError('excursionDateOutOfRange') && excursionForm.get('date')?.touched">
      Excursion date must be within the vacation dates.
    </div>
  </div>
  <button class="btn btn-primary" type="submit" [disabled]="excursionForm.invalid">
    {{ isEditMode ? 'Update Excursion' : 'Save Excursion' }}
  </button>
</form>

<!-- Table -->
<table class="table table-hover table-striped" *ngIf="excursions.length > 0">
  <thead>
    <tr>
      <th>Name</th>
      <th>Date</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let excursion of excursions">
      <td>{{ excursion.name }}</td>
      <td>{{ excursion.date | date }}</td>
      <td>
        <button 
          class="btn btn-outline-primary btn-sm"
          (click)="updateExcursion(excursion)"
        >
          Update
        </button>
        <button 
          class="btn btn-outline-danger btn-sm"
          (click)="deleteExcursion(excursion.id)"
        >
          Delete
        </button>
      </td>
    </tr>
  </tbody>
</table>

<p *ngIf="excursions.length === 0">No excursions yet.</p>
