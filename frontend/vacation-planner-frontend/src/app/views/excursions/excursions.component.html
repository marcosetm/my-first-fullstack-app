<hr class="my-4" />

<h5 class="d-flex justify-content-between align-items-center">
  Excursions
  <button class="btn btn-sm btn-primary" (click)="toggleForm()">
    {{ showForm ? 'Cancel' : 'Add Excursion' }}
  </button>
</h5>

<!-- Excursion Form -->
<div *ngIf="showForm" class="card mb-4 shadow-sm">
  <div class="card-body">
    <form [formGroup]="excursionForm" (ngSubmit)="onSubmit()">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="name" class="form-label">Excursion Name</label>
          <input type="text" id="name" class="form-control" formControlName="name" />
          <div class="text-danger mt-1" *ngIf="excursionForm.get('name')?.touched && excursionForm.get('name')?.invalid">
            Name is required.
          </div>
        </div>

        <div class="col-md-6 mb-3">
          <label for="date" class="form-label">Excursion Date</label>
          <input type="date" id="date" class="form-control" formControlName="date" />
          <div class="text-danger mt-1" *ngIf="excursionForm.get('date')?.touched && excursionForm.get('date')?.hasError('excursionDateOutOfRange')">
            Date must be within vacation start and end dates.
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-end">
        <button class="btn btn-primary" type="submit" [disabled]="excursionForm.invalid">
          {{ isEditMode ? 'Update Excursion' : 'Save Excursion' }}
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Excursion List -->
<div *ngIf="excursions.length > 0" class="table-responsive">
  <table class="table table-striped table-hover align-middle">
    <thead class="table-light">
      <tr>
        <th>Name</th>
        <th>Date</th>
        <th style="width: 150px">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let excursion of excursions">
        <td>{{ excursion.name }}</td>
        <td>{{ excursion.date | date }}</td>
        <td>
          <div class="d-flex gap-2">
            <div class="btn-group">
              <button class="btn btn-outline-primary btn-sm" (click)="updateExcursion(excursion)">
                Update
              </button>
              <button class="btn btn-outline-danger btn-sm" (click)="openDeleteModal(excursion)">
                Delete
              </button>
            </div>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<p *ngIf="excursions.length === 0" class="text-muted">No excursions added yet.</p>

<!-- Delete Confirmation Modal -->
<div
  class="modal fade"
  id="deleteModal"
  tabindex="-1"
  aria-labelledby="deleteModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title" id="deleteModalLabel">Confirm Deletion</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        Are you sure you want to delete the excursion <strong>{{ excursionToDelete?.name }}</strong>?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" (click)="deleteExcursion()" data-bs-dismiss="modal">Yes, Delete</button>
      </div>
    </div>
  </div>
</div>
