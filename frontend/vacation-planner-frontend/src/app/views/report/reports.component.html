<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Vacation Report</h2>
    <button class="btn btn-outline-secondary" [routerLink]="['/vacations']">
      Back to Vacations
    </button>
  </div>

  <div *ngIf="!objectKeys(groupedVacations).length" class="alert alert-info">
    No vacations to report.
  </div>

  <div *ngFor="let date of objectKeys(groupedVacations)" class="mb-4">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white fw-semibold">
        {{ date }}
      </div>
      <ul class="list-group list-group-flush">
        <li *ngFor="let vacation of groupedVacations[date]" class="list-group-item">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              {{ vacation.title }}
              <small class="text-muted d-block">
                {{ vacation.startDate | date }} → {{ vacation.endDate | date }}
              </small>
            </div>
          </div>
        </li>
      </ul>
    </div>
  </div>
</div>
